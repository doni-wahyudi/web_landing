name: Build and Deploy Frontend
on:
  push:
    branches:
      - main # Change this if your main branch has a different name

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v6

      - name: ⚙️ Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: 🔨 Install dependencies
        run: npm install

      - name: 🏗️ Build Project
        run: npm run build

      - name: 📂 Sync Files to cPanel via lftp (Sequential & Firewall-Friendly)
        run: |
          lftp -c "set ftp:passive-mode true; set ftp:ssl-allow false; set net:connection-limit 1; set net:limit-total-connections 1; open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} -p 21 ${{ secrets.FTP_SERVER }}; mirror --parallel=1 -R ./dist/ /public_html/"
